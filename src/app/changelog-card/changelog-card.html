<button type="button" class="card" [class.not-visible]="item?.visible === false" [class.selected]="selected"
        [attr.aria-pressed]="selected || null" (click)="onPostClicked()">
    <div class="img-container">
      <img [src]="item?.imageUrl" alt="">
    </div>

    <div class="info-container">
      <p class="title">{{ item?.title }}</p>
      <p class="description">{{ item?.description }}</p>

      <div class="meta-row">
        <span class="meta-left">{{ appName }}</span>
        <span class="meta-left">{{ item?.channel }}</span>
        <span class="meta-left meta-mono">{{ item?.version }}</span>
        <span class="meta-right">{{ item?.publishedAt | date }}</span>
      </div>
    </div>
</button>
