<button class="news-item" [class.not-visible]="item?.visible === false" [class.selected]="selected" (click)="onPostClicked()">
  <div class="news-item">
    <div class="img-container">
      <img [src]="item?.imageUrl" alt="cover">
    </div>

    <div class="info-container">
      <p>{{ item?.title }}</p>
      <p>{{ item?.description }}</p>

      <div class="meta-row">
        <span class="meta-left">{{ item?.category }}</span>
        <span class="meta-right">
          @if (item?.readingTimeMinutes) {
            {{ item?.readingTimeMinutes }} min ·
          }
          {{ item?.publishedAt | date }}
        </span>
      </div>
    </div>
  </div>
</button>
