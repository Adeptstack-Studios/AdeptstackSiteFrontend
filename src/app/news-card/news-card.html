<div class="news-item">
  <div class="img-container">
    <img [src]="item?.imageUrl" alt="cover">
  </div>

  <div class="info-container">
    <p>{{ item?.title }}</p>
    <p>{{ item?.description }}</p>

    <div class="meta-row">
      <span class="meta-left">{{ item?.category }}</span>
      <span class="meta-right">{{ item?.publishedAt | date }}</span>
    </div>
  </div>
</div>
