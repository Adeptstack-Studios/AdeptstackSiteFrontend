<div class="overlay" (click)="onCloseModal()">
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="app-title" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <h2 id="app-title">{{ app?.name }}</h2>
      <p class="subtitle">{{ app?.slogan }}</p>
    </div>

    <div class="popup-body">
      <h2>{{app?.name}}</h2>
      <div style="display: flex; justify-content: space-around;">
        <markdown [data]="app?.description"></markdown>
        <img [src]="app?.image1Url" alt="cover" style="width: 50%; margin-left: 10px;">
      </div>

      <h2>Features</h2>
      <div style="display: flex; justify-content: space-around;">
        <img [src]="app?.image1Url" alt="cover" style="width: 50%; margin-right: 10px;">
        <markdown [data]="app?.feature1Desc"></markdown>
      </div>
      <div style="display: flex; justify-content: space-around;">
        <markdown [data]="app?.feature2Desc"></markdown>
        <img [src]="app?.image2Url" alt="cover" style="width: 50%; margin-left: 10px;">
      </div>
      <div style="display: flex; justify-content: space-around;">
        <img [src]="app?.image3Url" alt="cover" style="width: 50%; margin-right: 10px;">
        <markdown [data]="app?.feature3Desc"></markdown>
      </div>
    </div>

    <div class="popup-footer">
      <div class="footer-meta">
        <span class="date">{{ app?.publishedAt | date:'mediumDate' }}</span>
        <app-visibility-picker [value]="currentVisibility" [disabled]="isSavingVisibility"
                               (changed)="setVisibility($event)"/>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-delete" (click)="delete()">Delete</button>
        <button type="button" class="btn btn-edit" (click)="edit()">Edit</button>
      </div>
    </div>
  </div>
</div>
