<div class="overlay" (click)="onCloseModal()">
  <div class="popup" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <h2>{{ app?.name }}</h2>
      <p class="subtitle">{{ app?.slogan }}</p>
    </div>

    <div class="popup-body">
      <h2>{{app?.name}}</h2>
      <div style="display: flex; justify-content: space-around;">
        <markdown [data]="app?.description"></markdown>
        <img [src]="app?.image1Url" alt="cover" style="width: 50%; margin-left: 10px;">
      </div>

      <h2>Features</h2>
      <div style="display: flex; justify-content: space-around;">
        <img [src]="app?.image1Url" alt="cover" style="width: 50%; margin-right: 10px;">
        <markdown [data]="app?.feature1Desc"></markdown>
      </div>
      <div style="display: flex; justify-content: space-around;">
        <markdown [data]="app?.feature2Desc"></markdown>
        <img [src]="app?.image2Url" alt="cover" style="width: 50%; margin-left: 10px;">
      </div>
      <div style="display: flex; justify-content: space-around;">
        <img [src]="app?.image3Url" alt="cover" style="width: 50%; margin-right: 10px;">
        <markdown [data]="app?.feature3Desc"></markdown>
      </div>
    </div>

    <div class="popup-footer">
      <div class="footer-meta">
        <span class="date">{{ app?.publishedAt | date:'mediumDate' }}</span>
        <div class="visibility-picker" role="group" aria-label="Visibility">
          @for (option of visibilityOptions; track option.value) {
            <button type="button"
                    class="visibility-option"
                    [class.active]="currentVisibility === option.value"
                    [class.is-public]="option.value === 'PUBLIC'"
                    [class.is-unlisted]="option.value === 'UNLISTED'"
                    [class.is-private]="option.value === 'PRIVATE'"
                    [disabled]="isSavingVisibility"
                    [title]="option.hint"
                    (click)="setVisibility(option.value)">
              {{ option.label }}
            </button>
          }
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-edit" (click)="edit()">Edit</button>
        <button class="btn btn-delete" (click)="delete()">Delete</button>
      </div>
    </div>
  </div>
</div>
@if (isOpened) {
  <app-warning (delete)="isDelete($event)"></app-warning>
}
