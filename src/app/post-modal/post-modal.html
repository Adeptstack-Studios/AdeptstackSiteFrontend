<div class="overlay" (click)="onCloseModal()">
  <div class="popup" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <h2>{{ post?.title }}</h2>
      @if (appName) {
        <p class="subtitle">{{ appName }}</p>
      }
      <p class="subtitle">{{ post?.description }}</p>
    </div>

    <div class="popup-body">
      <markdown [data]="post?.content"></markdown>
    </div>

    <div class="popup-footer">
      <span class="date">{{ post?.publishedAt | date:'mediumDate' }}</span>

      <div class="actions">
        <button class="btn btn-push" (click)="sendPush()" [disabled]="isSendingPush || !post?.visible"
                [title]="post?.visible ? 'Send a push notification for this post' : 'Make it visible first'">
          {{ isSendingPush ? 'Sending...' : 'Send Push' }}
        </button>
        @if (isNews) {
          <button class="btn btn-newsletter" (click)="sendNewsletter()" [disabled]="isSendingNewsletter || !post?.visible"
                  [title]="post?.visible ? 'Send the newsletter to all subscribers' : 'Make it visible first'">
            {{ isSendingNewsletter ? 'Sending...' : 'Send Newsletter' }}
          </button>
        }
        <button class="btn btn-visibility" (click)="toggleVisibility()">
          {{ post?.visible ? 'Make Private' : 'Make Public' }}
        </button>
        <button class="btn btn-edit" (click)="edit()">Edit</button>
        <button class="btn btn-delete" (click)="delete()">Delete</button>
      </div>
    </div>
  </div>
</div>
@if (isOpened) {
  <app-warning (delete)="isDelete($event)"></app-warning>
}
