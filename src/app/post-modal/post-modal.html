<div class="overlay" (click)="onCloseModal()">
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="post-title" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <h2 id="post-title">{{ post?.title }}</h2>
      @if (appName) {
        <p class="subtitle">{{ appName }}</p>
      }
      <p class="subtitle">{{ post?.description }}</p>
    </div>

    <div class="popup-body">
      <markdown [data]="post?.content"></markdown>
    </div>

    <div class="popup-footer">
      <div class="footer-meta">
        <span class="date">{{ post?.publishedAt | date:'mediumDate' }}</span>
        <app-visibility-picker [value]="currentVisibility" [disabled]="isSavingVisibility"
                               (changed)="setVisibility($event)"/>
      </div>

      <div class="actions">
        <button type="button" class="btn" (click)="sendPush()" [disabled]="isSendingPush || !post?.visible"
                [title]="post?.visible ? 'Send a push notification for this post' : 'Make it visible first'">
          {{ isSendingPush ? 'Sending…' : 'Send push' }}
        </button>
        @if (isNews) {
          <button type="button" class="btn" (click)="sendNewsletter()" [disabled]="isSendingNewsletter || !post?.visible"
                  [title]="post?.visible ? 'Send the newsletter to all subscribers' : 'Make it visible first'">
            {{ isSendingNewsletter ? 'Sending…' : 'Send newsletter' }}
          </button>
        }
        <button type="button" class="btn btn-delete" (click)="delete()">Delete</button>
        <button type="button" class="btn btn-edit" (click)="edit()">Edit</button>
      </div>
    </div>
  </div>
</div>
