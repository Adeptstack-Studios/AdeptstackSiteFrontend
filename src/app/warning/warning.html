<div class="overlay" (click)="onCloseModal()">
  <div class="popup confirmation-modal" (click)="$event.stopPropagation()">

    <div class="icon-box">
      ⚠️
    </div>

    <h2>ATTENTION!</h2>
    <p>Are you sure you want to delete this? This action cannot be undone.</p>

    <div class="actions">
      <button class="btn btn-cancel" (click)="onCloseModal()">Cancel</button>
      <button class="btn btn-delete" (click)="onDelete()">Delete</button>
    </div>

  </div>
</div>
