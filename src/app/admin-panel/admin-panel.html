<header class="header">
  <div class="header-left">
    <img src="img/adeptstack_white.png" alt="logo" height="50" width="50">
    <h1>Admin Panel</h1>
  </div>
  <div class="header-right" *ngIf="currentUser as user">
    <div class="user-menu">
      <button type="button" class="user-button" (click)="toggleMenu()">
        {{ user.username }}
      </button>
      <div class="dropdown" *ngIf="isMenuOpen">
        <button type="button" class="dropdown-item" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>
</header>

<div class="admin-layout">
  <nav class="sidebar">
    <a routerLink="news" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">News</a>
    <a routerLink="changelogs" routerLinkActive="active">Changelogs</a>
    <a routerLink="apps" routerLinkActive="active">Apps</a>
  </nav>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
